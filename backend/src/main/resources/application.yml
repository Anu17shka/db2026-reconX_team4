# =============================================================================
# TICKET-ADV049 — Spring profile configuration (default + profile overrides)
#
# WHAT:    Base configuration shared across dev/uat/prod. Profile-specific
#          overrides live in application-{profile}.yml.
# =============================================================================

spring:
  application:
    name: reconx

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ADV012 — Liquibase configuration
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC

  # ADV081-ADV082 — Caffeine cache config
  cache:
    cache-names: instruments,counterparties
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

  # ADV128 — Kafka producer/consumer defaults
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: reconx-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.dbtraining.reconx.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.dbtraining.reconx.dto.TradeEvent


server:
  servlet:
    context-path: /api


# =============================================================================
# ADV083-ADV086 / ADV097 — Actuator + Prometheus exposure
# =============================================================================

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        reconciliation.duration: true

      percentiles:
        http.server.requests: 0.5,0.95,0.99

    tags:
      application: ${spring.application.name}


# =============================================================================
# ADV072 — JWT signing config
# =============================================================================

reconx:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-me-32-bytes-min!!}
      expiration-minutes: ${JWT_EXP_MIN:60}
      refresh-expiration-days: ${JWT_REFRESH_EXP_DAYS:7}
      issuer: reconx


logging:
  level:
    com.dbtraining.reconx: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

  pattern:
    correlation: "[%X{correlationId:-}] [%X{tradeRef:-}]"


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha

  api-docs:
    path: /v3/api-docs