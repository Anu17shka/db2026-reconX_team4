# =============================================================================
# TICKET-ADV049 — dev profile: H2 in-memory + Kafka can be disabled if not running
# =============================================================================

spring:

  h2:
    console:
      enabled: true
      path: /h2


  datasource:
    url: jdbc:postgresql://localhost:5432/reconx
    username: reconx_user
    password: reconx_pass
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false


# =============================================================================
# TICKET-ADV058 — Swagger / OpenAPI configuration
# =============================================================================

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

  api-docs:
    path: /v1/api-docs
    enabled: true


logging:
  level:
    com.dbtraining.reconx: DEBUG