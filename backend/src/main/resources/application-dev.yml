# =============================================================================
# TICKET-ADV049 — dev profile: PostgreSQL + Kafka disabled
# =============================================================================

spring:
  h2:
    console:
      enabled: true
      path: /h2

  datasource:
    url: jdbc:h2:mem:reconx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver


  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  kafka:
    listener:
      missing-topics-fatal: false

logging:
  level:
    com.dbtraining.reconx: DEBUG
