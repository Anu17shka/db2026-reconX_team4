# =============================================================================
# TICKET-ADV049 — dev profile: PostgreSQL + Kafka disabled
# =============================================================================

spring:
  h2:
    console:
      enabled: true
      path: /h2

  datasource:
    url: jdbc:postgresql://localhost:5432/reconx
    username: reconx_user
    password: reconx_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    listener:
      missing-topics-fatal: false

logging:
  level:
    com.dbtraining.reconx: DEBUG