# =============================================================================
# TICKET-ADV049 — dev profile: H2 in-memory + Kafka can be disabled if not running
# =============================================================================

spring:

  h2:
    console:
      enabled: true
      path: /h2

  # ADV049 — H2 in-memory, PostgreSQL-compat mode so dev behaves close enough
  # to uat/prod's real Postgres. NON_KEYWORDS=USER lets us name a JPA entity
  # `users` without H2 treating it as a reserved word; CASE_INSENSITIVE_IDENTIFIERS
  # lets CSV column names match the unquoted Liquibase column declarations.
  datasource:
    url: jdbc:h2:mem:reconx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver


  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  # H2 doesn't ship a JSONB type — Liquibase preconditions in the changelog skip
  # the JSONB GIN-index step on H2 (see 003-jsonb.xml).

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false


# =============================================================================
# TICKET-ADV058 — Swagger / OpenAPI configuration
# =============================================================================

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

  api-docs:
    path: /v1/api-docs
    enabled: true


logging:
  level:
    com.dbtraining.reconx: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
